name: CI

# When it runs: on every push and every pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Python 3.12 (the project's reference version).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install the project plus its development tooling.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 4. Linter: does the code follow the rules?
      - name: Ruff (lint)
        run: ruff check macro_quant/

      # 5. Static type checker.
      - name: Mypy (types)
        run: mypy

      # 6. Tests: is the financial logic correct?
      #    (Tests are offline: no API key required.)
      - name: Pytest (tests)
        run: pytest macro_quant/tests/ -q
