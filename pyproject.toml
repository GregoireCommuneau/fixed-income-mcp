[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-quant"
version = "0.1.0"
description = "Macro & fixed income analysis system with MCP server"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "yfinance>=0.2.36",
    "fredapi>=0.5.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "mcp>=1.0.0",
]

# Development dependencies: tools needed to develop and test the project,
# NOT required to run it. Install with:  pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",        # test runner
    "pytest-cov>=5.0",    # test coverage reporting
    "ruff>=0.6",          # linter + formatter
    "mypy>=1.11",         # static type checker
    "hypothesis>=6.100",  # property-based testing
]

[tool.setuptools.packages.find]
where = ["."]
include = ["macro_quant*"]

# Ruff: linter + formatter
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Enabled rule families:
#   E/W = style (pycodestyle), F = real errors (pyflakes, e.g. unused import)
#   I   = import sorting (isort), UP = syntax modernization (pyupgrade)
#   B   = common pitfalls (flake8-bugbear)
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    # Line length guided at 120 but not enforced: the code contains aligned
    # reference-data tables (data/yahoo.py, MACRO_SCENARIOS in risk.py) that
    # read better on a single line, and we do not run the autoformatter.
    "E501",
    # str+Enum -> StrEnum: deferred. The conversion would change the value of
    # str(member), used in describe()/serialization; revisit with dedicated
    # tests.
    "UP042",
]

# Mypy: static type checker
[tool.mypy]
# 3.12 = the dev interpreter version (recent numpy stubs require 3.12).
# The project stays compatible with >=3.11 (see requires-python), but we
# type-check against the version we actually run.
python_version = "3.12"
files = ["macro_quant"]
# Pydantic plugin: improves type inference on pydantic models.
plugins = ["pydantic.mypy"]
# prop-decorator: a known mypy limitation with the pydantic pattern
# @computed_field on top of @property (required by pydantic). The code is
# correct, so we disable this specific false positive.
disable_error_code = ["prop-decorator"]
# Many data libraries (yfinance, fredapi, matplotlib) ship incomplete type
# stubs: we ignore their missing types to focus on our own code, not the
# dependencies'.
ignore_missing_imports = true
# Starting level: lenient. We still check un-annotated functions and flag
# useless casts/ignores. Can be tightened later.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
