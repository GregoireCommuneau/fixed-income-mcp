[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-quant"
version = "0.1.0"
description = "Macro & fixed income analysis system with MCP server"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "yfinance>=0.2.36",
    "fredapi>=0.5.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "mcp>=1.0.0",
]

# Development dependencies: tools needed to develop and test the project,
# NOT required to run it. Install with:  pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",        # test runner
    "pytest-cov>=5.0",    # test coverage reporting
    "ruff>=0.6",          # linter + formatter (Étape 2)
    "mypy>=1.11",         # static type checker (Étape 3)
    "hypothesis>=6.100",  # property-based testing
]

[tool.setuptools.packages.find]
where = ["."]
include = ["macro_quant*"]

# ── Ruff: linter + formateur ──
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Familles de règles activées :
#   E/W = style (pycodestyle) · F = erreurs réelles (pyflakes, ex: import inutilisé)
#   I   = tri des imports (isort) · UP = modernisation de syntaxe (pyupgrade)
#   B   = pièges courants (flake8-bugbear)
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    # Longueur de ligne guidée à 120 mais non imposée : le code contient des
    # tables de données de référence alignées en colonnes (data/yahoo.py,
    # MACRO_SCENARIOS dans risk.py) plus lisibles sur une ligne, et on ne
    # lance pas le formateur automatique.
    "E501",
    # str+Enum -> StrEnum : reporté. La conversion changerait la valeur de
    # str(member), utilisée dans les describe()/sérialisations ; à revoir
    # avec des tests dédiés.
    "UP042",
]

# ── Mypy: vérificateur de types statique ──
[tool.mypy]
# 3.12 = version de l'interpréteur de dév (les stubs numpy récents exigent 3.12).
# Le projet reste compatible >=3.11 (voir requires-python), mais on type-check
# sur la version qu'on exécute réellement.
python_version = "3.12"
files = ["macro_quant"]
# Plugin pydantic : améliore l'inférence de types sur les modèles pydantic.
plugins = ["pydantic.mypy"]
# prop-decorator : limitation connue de mypy avec le pattern pydantic
# @computed_field au-dessus de @property (obligatoire pour pydantic).
# Le code est correct ; on désactive ce faux positif spécifique.
disable_error_code = ["prop-decorator"]
# Beaucoup de librairies data (yfinance, fredapi, matplotlib) n'ont pas de
# "type stubs" complets : on ignore leurs types manquants pour se concentrer
# sur NOTRE code, pas sur celui des dépendances.
ignore_missing_imports = true
# Niveau de départ : souple. On vérifie même les fonctions non annotées,
# et on signale les annotations inutiles. On durcira ensuite.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
